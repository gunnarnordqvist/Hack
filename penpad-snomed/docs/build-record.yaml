  - "Pinned action SHAs obtained from git ls-remote; unverified until a run passes."
  - "Features added later in the session (close-ups, aspects, list, several findings per sentence, general symptoms, English check) were built and tested by the same assistant; none has been reviewed by a person. The two heuristics with the most risk are the body-word lists (our own, unreviewed) and the ranking thresholds (tuned on our own phrases)."
  - "Tier-proportionality table and chapters 5, 6, 9, 17, 22 of the book were not read when this record was made."
  - "tools/make_artifact.py was removed (it bundled a local SNOMED snapshot into an artifact). The two private claude.ai artifacts made early in the session are stale and may hold SNOMED terms; the owner should delete them."

  - "The EmbeddingGemma 2 evaluation (docs/eval-embeddinggemma2.md) was built and run by the assistant on 60 phrases it wrote itself; an independent AI review found real flaws in the first version, which were corrected; no person has reviewed it."
ai_review:
