# Dependency policy. Every dependency has a purpose, a date and a reviewer (vibetodev, step 8 "Secure").
# tools/check_dependencies.py fails if a requirement is missing here, unpinned, or if a GitHub Action is not pinned to a commit.
#
# 'reviewer: pending' means: no human has looked at this entry yet. An AI check is not an approval (vibetodev, step 7). The owner or a
# colleague replaces 'pending' with a name and a date after checking spelling, registry, maintainer and pinning.
version: 1
checked: 2026-11-18
checked_by: "Claude (AI assistant) under the owner's brief; not an approval"

python:   # requirements-optional.txt, only for the local embedding re-rank
  - {name: numpy, version: "2.5.5", source: "PyPI", purpose: "vector maths for the embedding index", reviewer: pending}
  - {name: sentence-transformers, version: "6.3.0", source: "PyPI", purpose: "loads the embedding model and encodes text", reviewer: pending}
  - {name: torch, version: "2.15.0", source: "PyTorch CPU index (download.pytorch.org/whl/cpu)", purpose: "runtime for the embedding model", reviewer: pending}
  - {name: transformers, version: "5.23.0", source: "PyPI", purpose: "model code used by sentence-transformers (pinned for reproducibility)", reviewer: pending}
  - {name: pillow, version: "13.0.0", source: "PyPI", purpose: "EmbeddingGemma 2 loads an image processor even when only text is embedded", reviewer: pending}
  - {name: torchvision, version: "0.29.2", source: "PyTorch CPU index (download.pytorch.org/whl/cpu)", purpose: "same reason as pillow", reviewer: pending}
  - {name: soundfile, version: "0.14.0", source: "PyPI", purpose: "reads wav files for the audio encoder of EmbeddingGemma 2 (experiment only)", reviewer: pending}
  - {name: soxr, version: "1.1.0", source: "PyPI", purpose: "resampling for the audio encoder of EmbeddingGemma 2 (experiment only)", reviewer: pending}

python_dev:   # requirements-dev.txt, tests and CI only
  - {name: PyYAML, version: "6.0.3", source: "PyPI", purpose: "reads this policy and docs/specification.yaml in the checkers", reviewer: pending}

node:
  runtime: []   # the web app has no npm dependencies: plain ES modules and the browser

  dev:
    - {name: playwright, version: "not pinned: installed globally in the development sandbox", source: "npm", purpose: "browser end-to-end tests (tests/e2e.cjs); not run in CI", reviewer: pending}

actions:   # .github/workflows/pages.yml, pinned to commits (a tag can move)
  - {name: actions/checkout, tag: v4.4.0, sha: 11d5960a326750d5838078e36cf38b85af677262, purpose: "fetch the repository", reviewer: pending}
  - {name: actions/setup-node, tag: v4.4.0, sha: 49933ea5288caeca8642d1e84afbd3f7d6820020, purpose: "Node for the JavaScript tests", reviewer: pending}
  - {name: actions/setup-python, tag: v5.6.0, sha: a26af69be951a213d495a4c3e4e4022e16d87065, purpose: "Python for the tests and the site build", reviewer: pending}
  - {name: actions/upload-pages-artifact, tag: v3.0.1, sha: 56afc609e74202658d3ffba0e8f6dda462b719fa, purpose: "package the built site", reviewer: pending}
  - {name: actions/deploy-pages, tag: v4.0.5, sha: d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e, purpose: "publish to GitHub Pages", reviewer: pending}

vendored:   # source files copied into the repository
  - {name: "react-body-map path data", file: web/vendor/bodypaths.js, licence: "MIT (chain in THIRD_PARTY_NOTICES.md)", purpose: "front/back body figure and hand close-up", caveat: "origin of the original artwork not verified", reviewer: pending}

services:   # runtime data dependencies, not code
  - {name: "HL7 Nordics terminology server", url: "https://tx-nordics.fhir.org/fhir/r4", purpose: "SNOMED CT content at run time (client mode); receives the search words typed by the visitor", risk: "third party; availability and terms are outside our control", reviewer: pending}

models:   # local only, not part of the public site
  - {name: "google/embeddinggemma-2", licence: "Apache-2.0 (not gated)", purpose: "experiment: text and audio embeddings for picking a finding and filling answers (backend/eval_two_step.py, eval_voice.py); not used by the app", reviewer: pending}
  - {name: "FremyCompany/BioLORD-2023-M", licence: "ihtsdo-and-nlm-licences", purpose: "optional embedding re-rank in the local server", reviewer: pending}

browser_optional:   # loaded by web/mlworker.js only after the visitor turns on "Local AI"; nothing is loaded otherwise
  - {name: "@huggingface/transformers", version: "4.3.2", source: "cdn.jsdelivr.net/npm (version-pinned URL)", purpose: "runs the embedding and speech models in the browser (ONNX Runtime Web)", risk: "code from a CDN runs in a Web Worker of the page; it also fetches its ONNX Runtime wasm files from jsDelivr; no subresource integrity for a module import", reviewer: pending}
  - {name: "Xenova/multilingual-e5-small", version: "main (not pinned to a revision)", source: "huggingface.co", licence: "MIT", purpose: "text embeddings for the semantic search, 118 MB", reviewer: pending}
  - {name: "KBLab/kb-whisper-base", version: "main (not pinned to a revision)", source: "huggingface.co", licence: "Apache-2.0", purpose: "Swedish speech recognition in the browser, 181 MB", reviewer: pending}
  - {name: "Xenova/whisper-base", version: "main (not pinned to a revision)", source: "huggingface.co", licence: "Apache-2.0", purpose: "English speech recognition in the browser, 76 MB", reviewer: pending}
