name: Deploy site

# Publishes the branch `gh-pages` (the built static site, no SNOMED CT content) to GitHub Pages.
# The workflow lives on `main` because the `github-pages` environment only accepts deployments from the default branch.
# Run it from the Actions tab (Run workflow) after the site on `gh-pages` has been updated.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
